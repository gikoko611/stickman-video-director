name: Myanmar Cinematic Story Render

on:
  workflow_dispatch:
    inputs:
      render_quality:
        description: "Encoding profile (final file is always capped below 10 MB)"
        required: true
        type: choice
        options:
          - balanced
          - compact
        default: balanced

permissions:
  contents: read

concurrency:
  group: myanmar-cinematic-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rendering tools and Myanmar fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ffmpeg fonts-noto-core fonts-noto-extra
          fc-match "Noto Sans Myanmar"

      - name: Install Python renderer dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Verify Deepgram secret
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
        run: |
          if [ -z "$DEEPGRAM_API_KEY" ]; then
            echo "::error::Add DEEPGRAM_API_KEY in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Deepgram API key is present (value hidden)."

      - name: Render cinematic Myanmar village story
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          RENDER_QUALITY: ${{ inputs.render_quality }}
        run: |
          python production/myanmar_village/render.py

      - name: Upload MP4 and production report
        uses: actions/upload-artifact@v4
        with:
          name: GI-KO-KO-Myanmar-Village-Cinematic-480p
          path: |
            output/GI-KO-KO-Myanmar-Village-Cinematic-480p.mp4
            output/production-report.json
            output/subtitles-my.srt
          if-no-files-found: error
          retention-days: 30
